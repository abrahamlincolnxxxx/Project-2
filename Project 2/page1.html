<!DOCTYPE html>
<!-- Document type declaration for HTML -->
<html lang="en">
<!-- English language setting for the page -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple calculator interface with clear buttons and display.">
    <title>Project 2</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Page title shown at the top of the calculator page -->
    <h1>Project 2</h1>

    <!-- Main calculator wrapper contains the display and all buttons -->
    <section class="calculator">
        <!-- Display area shows the current number or expression -->
        <section class="display-container">
            <div class="display" id="display">0</div>
        </section>

        <!-- Buttons area contains operators, digits, and actions -->
        <section class="buttons-container">
            <div class="operators">
                <button onclick="appendToDisplay('+')">+</button>
                <button onclick="appendToDisplay('-')">-</button>
                <button onclick="appendToDisplay('*')">x</button>
                <button onclick="appendToDisplay('^')">^</button>
                <button onclick="appendToDisplay('/')">/</button>
            </div>

            <div class="buttons">
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>
                <button onclick="appendToDisplay('9')">9</button>
                <button onclick="appendToDisplay('0')">0</button>
                <button onclick="appendToDisplay('.')">.</button>
                <button class="clear" onclick="clearDisplay()">C</button>
            </div>

            <!-- Equals button runs the calculation and shows the result -->
            <button class="equals" onclick="calculate()">=</button>
        </section>
    </section>
</body>
</html>
